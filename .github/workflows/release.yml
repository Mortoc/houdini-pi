name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar czf houdini-pi-dist-${GITHUB_REF_NAME}.tar.gz ui/dist sidecar/dist protocol/dist pi/dist
      - uses: softprops/action-gh-release@v2
        with:
          files: houdini-pi-dist-*.tar.gz
